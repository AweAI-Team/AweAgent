[project]
name = "awe-agent"
version = "0.1.0"
description = "A unified, composable framework to build, evaluate, and train agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "openai>=1.66.0,<3.0.0",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "tenacity>=8.2,<10",
    "tiktoken>=0.7.0",
    "structlog>=24.0",
    "docker>=7.0",
    "anthropic>=0.30.0",           # Anthropic (Claude) LLM backend
    "sandbox_fusion",              # IterResearch PythonInterpreter tool (SandboxFusion client)
    "json5",                       # lenient parsing of string-encoded tool args
    "huggingface_hub",             # benchmark dataset downloads (BeyondSWE / ScaleSWE)
    "pandas",                      # BrowseComp parquet loading
    "pyarrow",                     # BrowseComp parquet loading
]

[project.optional-dependencies]
# Volcengine Ark LLM backend — heavy / region-specific SDK, kept optional.
ark = ["volcengine-python-sdk[ark]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
awe-agent = "aweagent.cli:main"

[project.entry-points."aweagent.llm_backend"]
openai = "aweagent.core.llm.backends.openai:OpenAIBackend"
azure = "aweagent.core.llm.backends.openai:OpenAIBackend"
ark = "aweagent.core.llm.backends.ark:ArkBackend"
sglang = "aweagent.core.llm.backends.sglang:SGLangBackend"
anthropic = "aweagent.core.llm.backends.anthropic:AnthropicBackend"
openai_response = "aweagent.core.llm.backends.openai_response:OpenAIResponseBackend"

[project.entry-points."aweagent.runtime"]
docker = "aweagent.core.runtime.docker:DockerRuntime"

[project.entry-points."aweagent.agent"]
search_swe = "aweagent.scaffold.search_swe.agent:SearchSWEAgent"
deepsearch = "aweagent.scaffold.deepsearch.agent:DeepSearchAgent"
terminus_2 = "aweagent.scaffold.terminus_2.agent:Terminus2Agent"
iter_research = "aweagent.scaffold.iter_research.agent:IterResearchAgent"

[project.entry-points."aweagent.evaluator"]
beyond_swe = "aweagent.tasks.beyond_swe.evaluator:BeyondSWEEvaluator"
terminal_bench_v2 = "aweagent.tasks.terminal_bench_v2.evaluator:TerminalBenchV2Evaluator"
browsecomp = "aweagent.tasks.browsecomp.evaluator:BrowseCompEvaluator"

[project.entry-points."aweagent.search_backend"]
serpapi = "aweagent.core.tool.search.backends.search.serpapi:SerpAPIBackend"

[project.entry-points."aweagent.reader_backend"]
jina = "aweagent.core.tool.search.backends.reader.jina:JinaReaderBackend"

[project.entry-points."aweagent.tool"]
execute_bash = "aweagent.core.tool.code.bash:ExecuteBashTool"
str_replace_editor = "aweagent.core.tool.code.editor:StrReplaceEditorTool"
think = "aweagent.core.tool.code.think:ThinkTool"
finish = "aweagent.core.tool.code.finish:FinishTool"
web_search = "aweagent.core.tool.search:WebSearchTool"
web_fetch = "aweagent.core.tool.search:WebFetchTool"
web_fetch_raw = "aweagent.core.tool.search:WebFetchRawTool"
python_interpreter = "aweagent.core.tool.public.python_interpreter:PythonInterpreterTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aweagent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt modules hold verbatim, model-facing text that must not be reflowed.
"aweagent/scaffold/*/prompts.py" = ["E501"]
"aweagent/scaffold/*/prompts/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
