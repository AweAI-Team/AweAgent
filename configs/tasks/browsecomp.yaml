# BrowseComp + DeepSearch configuration
#
# DeepSearch answers from web search/fetch and submits text, so it runs no
# shell commands and needs no container runtime (BrowseCompTask.requires_runtime
# is False; the runner runs the agent without opening a session).

llm: "!include ../llm/openai.yaml"

agent:
  type: deepsearch
  max_steps: 100
  rollout_retries: 0
  force_final_answer: true
  tools:
    - web_search
    - web_fetch
    - finish
  tool_options:
    web_search:
      backend: serpapi
      engine: google
      max_attempts: 3
    web_fetch:
      reader_backend: jina
      max_attempts: 3
      reader_max_attempts: 3
  condenser:
    type: tool_result_omission
    keep_recent_tool_results: 5

task:
  type: browsecomp
  dataset_id: browsecomp
  # Defaults to the downloaded set (datasets/download.sh browsecomp). Override
  # with BROWSECOMP_DATA_FILE to point at a subset, e.g. a 200-record jsonl.
  data_file: ${BROWSECOMP_DATA_FILE:-datasets/browsecomp/browse_comp_test_set.csv}

eval:
  enabled: true
  timeout: 3600
  # Optional: set a separate judge model. If omitted, the search LLM is reused.
  # judge_llm:
  #   backend: openai
  #   model: gpt-4o
  #   api_key: ${OPENAI_API_KEY}
  #   params:
  #     temperature: 0.0
  #     max_tokens: 1024

execution:
  max_concurrent: 50
  max_retries: 3
  output_path: ./results/browsecomp
