# DeepSeek Reasoner
# Docs: https://api-docs.deepseek.com/guides/reasoning_model
backend: openai
base_url: https://api.deepseek.com/v1
api_key: ${DEEPSEEK_API_KEY}
model: deepseek-reasoner
params:
  max_completion_tokens: 8192
thinking: true
reasoning:
  # deepseek-reasoner: sending reasoning_content back causes 400 error
  # NOTE: deepseek-chat with thinking mode + tools requires preserve: true
  #       for tool-call loops (but strip for new user turns). Not yet supported.
  preserve: false
  format: reasoning_content
